<style>
.subscribe-button {
    background-color: rgb(220, 15, 15);
    color: white;
    border: none;
    height: 39px;
    width: 110px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
    transition: opacity 0.15s;
    /*pedding yapmak width ve height ile
    calismaktan daha mantikli,
    kelime tasmasi olmaz*/
 }

 .subscribe-button:hover {
    opacity: 0.7;
 }

 .subscribe-button:active {
    opacity: 0.43;
 }

.join-button {
    background-color: white;
    color: rgb(55, 55, 227);
    border: 1px solid rgb(62, 62, 219);
    height: 39px;
    width: 70px;
    border-radius: 1px;
    cursor: pointer;
    margin-right: 7px;
     transition: background-color 0.182s,color 0.5s;
}  

.join-button:hover {
    background-color: rgb(55, 55, 227);
    color: white;
}

.join-button:active {
    opacity: 0.73;
}

.tweet-button {
    background-color: rgb(45, 171, 255);
    color: white;
    border: none;
    height: 36px;
    width: 73px;
    border-radius: 20px;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
    transition: box-shadow 0.16s;
    /*red,green,blue,opacity*/
    /*vericle-align: top,bottom,middle,baseline; bu komutlar 
    top,bottom,middle,baseline olusuna gore duzlemleri esitler */
}

.tweet-button:hover {
    box-shadow: 0 0.43px 10px rgb(110, 104, 104);
/*1.=horizontal,2.=vertical,3.=blur*/
}

.tweet-button:active {
    opacity: 0.78;
}

</style>

<button class="subscribe-button">
    SUBSCRIBE
</button>

<button class="join-button">
    JOIN
</button>

<button class="tweet-button">
    Tweet
</button>
